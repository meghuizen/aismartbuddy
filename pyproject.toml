[project]
name = "aismartbuddy"
version = "0.1.0"
description = "AI-extending MCP server with SQL and graph database capabilities"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=1.9.4",
    "duckdb>=1.5.1",
    "real-ladybug>=0.15.3",
    "polars>=1.0",
    "pyarrow>=17.0",
    "tabulate>=0.9.0",
    "click>=8.1.8",
    "python-dotenv>=1.0.0",
    "starlette>=0.46.1",
    "uvicorn>=0.34.0",
    "anyio>=4.8.0",
    "lxml>=6.0.4",
    "yt-dlp>=2026.3.17",
    "youtube-transcript-api>=1.2.4",
    # Used directly in youtube_client.py for the shared requests.Session;
    # arrives transitively from youtube-transcript-api but we pin it
    # explicitly so a future upstream switch (e.g. to httpx) doesn't break us.
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1",
]

[project.scripts]
aismartbuddy = "aismartbuddy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aismartbuddy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that hit the real network (YouTube). Skipped by default.",
]
addopts = "-m 'not integration'"
