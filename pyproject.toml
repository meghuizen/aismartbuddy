[project]
name = "aismartbuddy"
version = "0.1.0"
description = "AI-extending MCP server with SQL and graph database capabilities"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # MCP v2 is pre-release: pin exactly until the stable API ships.
    "mcp==2.0.0b1",
    # Transitive pre-release of mcp==2.0.0b1. Older uv releases (e.g. 0.11.x)
    # only allow pre-releases for packages that carry a pre-release specifier
    # in the *requested* dependencies, so `uvx --from git+...` fails without
    # `--prerelease=allow` unless this is pinned here too. Keep in lockstep
    # with the mcp pin above.
    "mcp-types==2.0.0b1",
    "duckdb>=1.5.4",
    "ladybug>=0.18.1",
    "polars>=1.0",
    "pyarrow>=17.0",
    "tabulate>=0.9.0",
    "click>=8.1.8",
    "python-dotenv>=1.0.0",
    "starlette>=0.46.1",
    "uvicorn>=0.34.0",
    "anyio>=4.8.0",
    "lxml>=6.0.4",
    "yt-dlp>=2026.3.17",
    "youtube-transcript-api>=1.2.4",
    # Rust-backed HTTP/HTML-to-Markdown crawler with optional native browser fallback.
    "crawlberg>=1.0.5,<2",
    # Shared async HTTP/2 client for provider adapters and X oEmbed.
    "httpx[http2]>=0.27",
    # Used directly in youtube_client.py for the shared requests.Session;
    # arrives transitively from youtube-transcript-api but we pin it
    # explicitly so a future upstream switch (e.g. to httpx) doesn't break us.
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1",
    # For test_entra_auth.py — generates RSA keypairs and signs JWTs
    "pyjwt[crypto]>=2.9",
]
# Optional: Microsoft Entra ID (Azure AD) OAuth token verification.
# Activate at runtime by setting AISMARTBUDDY_ENTRA_TENANT and
# AISMARTBUDDY_ENTRA_AUDIENCE. Without this extra installed, those env
# vars cause a clear startup error pointing here.
entra = [
    "pyjwt[crypto]>=2.9",
]

[project.scripts]
aismartbuddy = "aismartbuddy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aismartbuddy"]

[tool.hatch.build.targets.wheel.force-include]
"thinking-frameworks" = "aismartbuddy/thinking-frameworks"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that hit the real network (YouTube). Skipped by default.",
]
addopts = "-m 'not integration'"
